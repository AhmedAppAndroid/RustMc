name: build-apk

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # lets tagged builds publish a Release
    steps:
      - uses: actions/checkout@v4

      # GitHub does not unzip uploaded zip files, so do it here
      - name: Unzip project files
        run: |
          for z in "mclite 2.0.zip" "mclite.2.0.zip"; do
            if [ -f "$z" ]; then echo "unzipping $z"; unzip -oq "$z"; fi
          done
          find . -maxdepth 3 -not -path './.git*' -not -path '*/__MACOSX*' | head -60

      - name: Locate project
        run: |
          C=$(find . -name Cargo.toml -not -path '*/target/*' -not -path '*/__MACOSX/*' | head -n 1)
          M=$(find . -path '*/src/main/AndroidManifest.xml' -not -path '*/build/*' -not -path '*/__MACOSX/*' | head -n 1)
          G=$(find . \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/build/*' -not -path '*/__MACOSX/*' | head -n 1)
          if [ -z "$C" ] || [ -z "$M" ] || [ -z "$G" ]; then
            echo "Error: project not found. Cargo.toml='$C' AndroidManifest='$M' settings.gradle='$G'"
            echo "Files in this repo:"
            find . -type f -not -path './.git/*' | head -80
            exit 1
          fi
          echo "CARGO_DIR=$(dirname "$C")" >> "$GITHUB_ENV"
          echo "GRADLE_DIR=$(dirname "$G")" >> "$GITHUB_ENV"
          echo "JNI_DIR=$(cd "$(dirname "$M")" && pwd)/jniLibs" >> "$GITHUB_ENV"
          cat "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.CARGO_DIR }}

      - name: Rust tests
        continue-on-error: true
        working-directory: ${{ env.CARGO_DIR }}
        run: cargo test

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build libmclite.so (arm64)
        working-directory: ${{ env.CARGO_DIR }}
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          mkdir -p "$JNI_DIR"
          cargo ndk -t arm64-v8a -o "$JNI_DIR" build --release
          ls -l "$JNI_DIR"/arm64-v8a

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        working-directory: ${{ env.GRADLE_DIR }}
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; ./gradlew assembleDebug --no-daemon
          else gradle assembleDebug --no-daemon; fi

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'

      - name: Publish release APK (tags like v0.1)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: '**/build/outputs/apk/debug/*.apk'
