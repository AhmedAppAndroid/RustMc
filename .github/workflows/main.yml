name: build-apk

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate project
        run: |
          F=$(find . -name Cargo.toml -not -path "*/target/*" | head -n 1)
          if [ -z "$F" ]; then
            echo "::error::Cargo.toml not found. Files in this repo:"
            git ls-files | head -50
            exit 1
          fi
          echo "PROJ=$(dirname "$F")" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.PROJ }}

      - name: Rust tests
        working-directory: ${{ env.PROJ }}
        run: cargo test

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build libmclite.so (arm64)
        working-directory: ${{ env.PROJ }}
        run: cargo ndk -t arm64-v8a -o app/src/main/jniLibs build --release

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mclite-debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk

      - name: Publish release APK (tags like v0.1)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
